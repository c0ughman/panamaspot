[build]
  command = "npm run build"
  publish = "out"

# Preserve the old /funnels/:slug → /funnels/:slug.html rewrite
# (the old next.config rewrite is gone because static export
# does not support rewrites).
[[redirects]]
  from = "/funnels/:slug"
  to = "/funnels/:slug.html"
  status = 200
  force = false

# Guide fonts may be loaded by the SEO dashboard's page preview (another domain);
# browsers only do that when the font allows it.
# Browser caching (2026-11 SEO pass): Netlify's default is max-age=0, so every repeat visit
# re-checked every photo, font and video. File names are NOT fingerprinted (a swapped photo keeps
# its name), so the lifetimes are moderate: a replaced file can look stale to a returning visitor
# for up to this long. HTML, CSS and JS keep Netlify's default (always revalidate).
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/video/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/og-default.jpg"
  [headers.values]
    Cache-Control = "public, max-age=604800"
