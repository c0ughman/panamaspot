[build]
  command = "npm run build"
  publish = "out"

# Preserve the old /funnels/:slug → /funnels/:slug.html rewrite
# (the old next.config rewrite is gone because static export
# does not support rewrites).
[[redirects]]
  from = "/funnels/:slug"
  to = "/funnels/:slug.html"
  status = 200
  force = false

# Guide fonts may be loaded by the SEO dashboard's page preview (another domain);
# browsers only do that when the font allows it.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
